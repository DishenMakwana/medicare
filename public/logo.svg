<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100" fill="none">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>
  <!-- Icon Squircle -->
  <rect x="10" y="10" width="80" height="80" rx="24" fill="url(#logo-grad)" />
  <!-- Pulse Line -->
  <path
    d="M 28 50 L 38 50 L 46 32 L 56 68 L 64 50 L 72 50"
    fill="none"
    stroke="#ffffff"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- MediCare Brand Text -->
  <text x="108" y="52" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="38" fill="#0f172a" letter-spacing="-1">MediCare</text>
  <!-- Subtitle -->
  <text x="110" y="74" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="14" fill="#64748b" letter-spacing="0.2">Family Health Intelligence</text>
</svg>
